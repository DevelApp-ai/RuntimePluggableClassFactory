permissions:
  contents: write
  packages: write
name: .NET CI/CD

# Stable NuGet releases are signed with Certum cloud code signing before
# publishing (org decision DevelApp-ai/DevelApp-Repo-Global#38, 2026-11-11):
# the sign job (windows-latest) signs + verifies every .nupkg via
# `dotnet nuget sign --certificate-sha1 <thumbprint> --timestamper
# http://time.certum.pl` and `dotnet nuget verify`, then the publish job
# pushes only verified packages and attaches them to the GitHub Release.
# Prerelease pushes skip signing entirely (current unsigned behavior) so
# no TOTP window is burned on every merge to main. Thumbprint comes from
# the CODE_SIGNING_CERT_THUMBPRINT org secret; the SimplySign login uses
# the CERTUM_SIMPLYSIGN_* org secrets and never sees
# CERTUM_SIMPLYSIGN_PASSWORD. Stack proven green by the LocalTaskhandler
# signing test (run 43089090840, 2026-11-11).
#
# Triggers the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      nugetversion: ${{ steps.version.outputs.nugetversion }}
      isprerelease: ${{ steps.version.outputs.isprerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Fetches all history for GitVersion

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion # The output of this step is used later
      uses: gittools/actions/gitversion/execute@v0.10.2
      continue-on-error: true

    - name: Set fallback version
      id: fallback-version
      if: failure()
      run: |
        echo "GitVersion failed, using fallback version"
        echo "semVer=2.0.1-fallback.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RuntimePluggableClassFactory.sln

    - name: Set version variables
      id: version
      run: |
        if [ "${{ steps.gitversion.outcome }}" == "success" ]; then
          echo "semver=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "nugetversion=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "Using GitVersion: ${{ steps.gitversion.outputs.semVer }}"
          if [[ "${{ steps.gitversion.outputs.semVer }}" == *-* ]]; then
            echo "isprerelease=true" >> $GITHUB_OUTPUT
          else
            echo "isprerelease=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "semver=${{ steps.fallback-version.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "nugetversion=${{ steps.fallback-version.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "isprerelease=true" >> $GITHUB_OUTPUT
          echo "Using fallback version: ${{ steps.fallback-version.outputs.semVer }}"
        fi

    - name: Build
      run: |
        dotnet build RuntimePluggableClassFactory.Interface/RuntimePluggableClassFactory.Interface.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build RuntimePluggableClassFactory/RuntimePluggableClassFactory.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build PluginImplementations/PluginImplementations.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build PluginImplementations_1_2_1/PluginImplementations_1_2_1.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build PluginImplementations_1_2_2/PluginImplementations_1_2_2.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build PluginImplementations_1_3_1/PluginImplementations_1_3_1.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build PluginImplementations_1_4_1/PluginImplementations_1_4_1.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build RuntimePluggableClassFactory.Containerized/RuntimePluggableClassFactory.Containerized.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}
        dotnet build RuntimePluggableClassFactory.Containerized.Kubernetes/RuntimePluggableClassFactory.Containerized.Kubernetes.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}

    - name: Test
      run: |
        # The test projects load plugin DLLs from PluginFolder/, which the
        # PluginImplementations_* post-build targets populated during the Build step above.
        dotnet test RuntimePluggableClassFactory.Test/RuntimePluggableClassFactory.Test.csproj --configuration Release --nologo
        dotnet test RuntimePluggableClassFactory.Containerized.Tests/RuntimePluggableClassFactory.Containerized.Tests.csproj --configuration Release --nologo

    - name: Pack
      run: |
        dotnet pack RuntimePluggableClassFactory/RuntimePluggableClassFactory.csproj --no-build --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.nugetversion }}
        dotnet pack RuntimePluggableClassFactory.Interface/RuntimePluggableClassFactory.Interface.csproj --no-build --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.nugetversion }}
        # CRPCF packages are packed into a separate folder: they are published to
        # GitHub Packages only and must never leak to NuGet.org or release assets.
        dotnet pack RuntimePluggableClassFactory.Containerized/RuntimePluggableClassFactory.Containerized.csproj --no-build --configuration Release -o ./artifacts-containerized /p:PackageVersion=${{ steps.version.outputs.nugetversion }}
        dotnet pack RuntimePluggableClassFactory.Containerized.Kubernetes/RuntimePluggableClassFactory.Containerized.Kubernetes.csproj --no-build --configuration Release -o ./artifacts-containerized /p:PackageVersion=${{ steps.version.outputs.nugetversion }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

    - name: Upload containerized artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-containerized
        path: ./artifacts-containerized/*.nupkg

  sign:
    # Stable releases only (decision #38): prerelease pushes skip signing
    # entirely so no TOTP window is burned on every merge to main.
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.isprerelease == 'false'
    runs-on: windows-latest
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Download containerized artifacts
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-containerized
        path: ./artifacts-containerized

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11) and shaztechio/bunyi-app #171.
      # Never sees CERTUM_SIMPLYSIGN_PASSWORD — that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet packages
      shell: pwsh
      env:
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
      run: |
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        $packages = @(Get-ChildItem ./artifacts/*.nupkg, ./artifacts-containerized/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-sha1 $tp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem ./artifacts/*.nupkg, ./artifacts-containerized/*.nupkg)
        foreach ($p in $packages) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-signed
        path: ./artifacts/*.nupkg

    - name: Upload containerized signed artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-containerized-signed
        path: ./artifacts-containerized/*.nupkg

  publish:
    # Publishing and the GitHub Release now depend on sign: stable pushes
    # publish the SIGNED packages; prerelease pushes (sign skipped) keep
    # the current unsigned behavior. A sign FAILURE blocks publishing.
    needs: [build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - name: Download signed artifacts
      if: needs.sign.result == 'success'
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-signed
        path: ./artifacts

    - name: Download signed containerized artifacts
      if: needs.sign.result == 'success'
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-containerized-signed
        path: ./artifacts-containerized

    - name: Download artifacts (prerelease, unsigned)
      if: needs.sign.result != 'success'
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Download containerized artifacts (prerelease, unsigned)
      if: needs.sign.result != 'success'
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-containerized
        path: ./artifacts-containerized

    - name: Publish to GitHub Packages
      # Publishes ALL versions (beta/prerelease and stable) to GitHub Packages.
      # Runs first and is not affected by any NuGet.org problems.
      # The Containerized packages are private org packages: GitHub Packages only,
      # never NuGet.org.
      if: github.event_name == 'push'
      run: |
        dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DevelApp-ai/index.json --skip-duplicate
        dotnet nuget push ./artifacts-containerized/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DevelApp-ai/index.json --skip-duplicate

    - name: Publish to NuGet.org
      # Only stable (non-prerelease) versions are published to NuGet.org.
      # A failure here must never block GitHub Packages publishing or the tagged release.
      if: github.event_name == 'push' && needs.build.outputs.isprerelease == 'false'
      continue-on-error: true
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      # Tags every push to main (stable and prerelease) as a GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.build.outputs.semver }}
        name: Release v${{ needs.build.outputs.semver }}
        body: |
          ## 📦 NuGet Packages

          Published to GitHub Packages:
          - DevelApp.RuntimePluggableClassFactory v${{ needs.build.outputs.semver }}
          - DevelApp.RuntimePluggableClassFactory.Interface v${{ needs.build.outputs.semver }}
          - DevelApp.RuntimePluggableClassFactory.Containerized v${{ needs.build.outputs.semver }} (GitHub Packages only, not on NuGet.org)
          - DevelApp.RuntimePluggableClassFactory.Containerized.Kubernetes v${{ needs.build.outputs.semver }} (GitHub Packages only, not on NuGet.org)

          Stable releases are also published to NuGet.org:
          - [DevelApp.RuntimePluggableClassFactory](https://www.nuget.org/packages/DevelApp.RuntimePluggableClassFactory) v${{ needs.build.outputs.semver }}
          - [DevelApp.RuntimePluggableClassFactory.Interface](https://www.nuget.org/packages/DevelApp.RuntimePluggableClassFactory.Interface) v${{ needs.build.outputs.semver }}

          ## 🚀 Features
          - Dynamic plugin loading and unloading with AssemblyLoadContext
          - Enhanced stability with comprehensive error handling
          - Type safety with strongly-typed plugin interfaces
          - Security hardening with multi-level validation
          - Comprehensive testing with 48 tests across 7 categories

          ## 📈 Performance
          - Plugin discovery: < 5 seconds
          - Plugin instantiation: < 100ms average
          - Plugin execution: < 10ms average
          - Concurrent throughput: > 100 exec/sec
          - Security validation: < 500ms average
          - Memory growth: < 50MB under load
        draft: false
        prerelease: ${{ needs.build.outputs.isprerelease == 'true' }}
        files: ./artifacts/*.nupkg